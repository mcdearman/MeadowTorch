[package]
name = "Torch"
version = "0.2.0"

# libtorch keeps its grad mode per OS thread, and the shim its scopes and last
# error. One worker keeps every green thread on one OS thread. A profile is the
# building package's, so a program that depends on Torch sets this itself.
[profile.debug]
threads = 1

[profile.release]
threads = 1

[profile.test]
threads = 1
